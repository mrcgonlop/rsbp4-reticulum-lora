---
# tasks file for syncthing
# Tags: syncthing

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"
  tags: [syncthing]

- name: Add Syncthing GPG key
  ansible.builtin.get_url:
    url: https://syncthing.net/release-key.gpg
    dest: /etc/apt/keyrings/syncthing-archive-keyring.gpg
    mode: "0644"
  tags: [syncthing]

- name: Add Syncthing APT repository
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/syncthing-archive-keyring.gpg] https://apt.syncthing.net/ syncthing stable-v2"
    filename: syncthing
    state: present
  tags: [syncthing]

- name: Install Syncthing
  ansible.builtin.apt:
    name: syncthing
    state: present
    update_cache: true
  tags: [syncthing]

- name: Create systemd drop-in directory for syncthing@.service
  ansible.builtin.file:
    path: /etc/systemd/system/syncthing@.service.d
    state: directory
    mode: "0755"
  tags: [syncthing]

- name: Deploy systemd override to bind GUI to localhost
  ansible.builtin.template:
    src: override.conf.j2
    dest: /etc/systemd/system/syncthing@.service.d/override.conf
    mode: "0644"
  notify: reload systemd and restart syncthing
  tags: [syncthing]

- name: Enable and start Syncthing for user pi
  ansible.builtin.systemd:
    name: "syncthing@pi"
    enabled: true
    state: started
    daemon_reload: true
  tags: [syncthing]